name: RDP - by @lucchese

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rdp-lucchese:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Check CPU - @lucchese
        id: cpu-check
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $cpuName = $cpu.Name.Trim()
          Write-Host "CPU: $cpuName"
          
          if ($cpuName -ne "Intel(R) Xeon(R) 6973P-C") {
            Write-Host "CPU não permitida: $cpuName"
            Write-Host "Somente Intel(R) Xeon(R) 6973P-C é permitido. Reiniciando..."
            gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
            exit 1
          }

          Write-Host "Intel(R) Xeon(R) 6973P-C detectado. Seguindo..."

      - name: Turbo Mode & Optimization - @lucchese
        shell: pwsh
        run: |
          Write-Host "Iniciando otimizacao extrema..."
          
          # 1. Desativar Windows Defender (Libera muita CPU/RAM)
          Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableIOAVProtection $true -DisableScriptScanning $true -SubmitSamplesConsent 2
          
          # 2. Desativar servicos inuteis (Telemetry, Search, SysMain)
          $services = @("DiagTrack", "wscsvc", "SearchIndexer", "SysMain", "WerSvc")
          foreach ($svc in $services) {
              if (Get-Service $svc -ErrorAction SilentlyContinue) {
                  Stop-Service $svc -Force -ErrorAction SilentlyContinue
                  Set-Service $svc -StartupType Disabled
              }
          }
          
          # 3. Ajustar para Melhor Desempenho (Visual Tweaks)
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'VisualFXSetting' -Value 2
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name 'VisualFXSetting' -Value 2
          
          # 4. Power Plan: Alto Desempenho
          powercfg /s 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          
          # 5. RDP Tweaks (Velocidade e Rede)
          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $rdpPath -Name "MinDeviceScaleFactor" -Value 100
          
          # Desativar compressao de rede inútil para conexões rápidas
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $tsPath)) { New-Item -Path $tsPath -Force }
          Set-ItemProperty -Path $tsPath -Name "fDisableUDP" -Value 1
          
          Write-Host "Otimizacao concluida com sucesso!"

      - name: Config RDP - @lucchese
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          
      - name: Create User - @lucchese
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = [char[]]@('!','@','#','$','*','_','-','+','=','~')
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          
      - name: Install Tailscale - @lucchese
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          
      - name: Connect Tailscale - @lucchese
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $outFile = "$env:TEMP\ts_out.log"
          $errFile = "$env:TEMP\ts_err.log"
          $proc = Start-Process -FilePath $ts -ArgumentList "up", "--authkey=${{ secrets.TAILSCALE_AUTH_KEY }}", "--hostname=gh-runner-$env:GITHUB_RUN_ID" -RedirectStandardOutput $outFile -RedirectStandardError $errFile -PassThru -NoNewWindow
          
          $linkFound = $false
          $timeoutSeconds = 300
          $elapsed = 0
          while (-not $proc.HasExited -and $elapsed -lt $timeoutSeconds) {
              $content = if (Test-Path $outFile) { Get-Content $outFile -Raw -ErrorAction SilentlyContinue } else { "" }
              $content += if (Test-Path $errFile) { Get-Content $errFile -Raw -ErrorAction SilentlyContinue } else { "" }
              if (-not $linkFound -and $content -match "(https://login\.tailscale\.com/\S+)") {
                  $link = $matches[1]
                  "### Tailscale Link`n$link" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                  Write-Host "Tailscale: $link"
                  $linkFound = $true
              }
              Start-Sleep -Seconds 3
              $elapsed += 3
          }
          $proc.WaitForExit()
          $tsIP = & $ts ip -4
          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: RDP Check - @lucchese
        run: |
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) { exit 1 }
          
      - name: Manter conexão - @lucchese
        run: |
          $cmd1 = "cmdkey /generic:TERMSRV/$env:TAILSCALE_IP /user:RDP /pass:`"$env:RDP_PASSWORD`""
          $cmd2 = "mstsc /v:$env:TAILSCALE_IP"
      
          Write-Host "`n=== RDP CREDENTIALS || METODO NO PC - @luccheselindo ==="
          Write-Host "Execute seu cmd como administrador e cole isto:"
          Write-Host ""
          Write-Host $cmd1
          Write-Host $cmd2
          Write-Host "==================`n"
      
          Write-Host "--------------------------------------------------------------"
      
          Write-Host "`n=== RDP CREDENTIALS || METODO MOBILE - @luccheselindo ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Senha: $env:RDP_PASSWORD"
          Write-Host "==================`n"
      
          "### Comandos`n``````$cmd1`n$cmd2`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - @lucchese"
              Start-Sleep -Seconds 300
          }
concurrency:
  
